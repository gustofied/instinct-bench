schema_version = "1.3"
artifacts = [
    { source = "/evidence-artifacts/state.json", service = "evidence" },
]

[task]
name = "instinct-bench/deployment-outage"
description = "Identify the deployment rolled back to resolve an outage while acquiring priced evidence."
authors = [{ name = "Adam Sioud" }]
keywords = ["context-appetite", "evidence", "tool-use", "sidecar", "deterministic-verifier"]

[metadata]
implementation_version = "0.2.1"
difficulty = "easy"
category = "reasoning"
tags = ["instinct-bench", "context-appetite", "evidence-cost"]
difficulty_explanation = "One record establishes the exact deployment, while other records provide partial or corroborating context at different costs."
solution_explanation = "The reference path opens the record containing the operation and rollback IDs, then submits the deployment supported by that record."
verification_explanation = "An authenticated evidence-sidecar collect hook snapshots the authoritative read ledger. A separate deterministic verifier gates success on the exact answer, required evidence, artifact integrity, and event-log consistency."

[verifier]
timeout_sec = 30.0
user = "root"
environment_mode = "separate"

[[verifier.collect]]
service = "evidence"
command = "python3 /opt/evidence/snapshot.py"
timeout_sec = 30.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 512
storage_mb = 1024
workdir = "/"

[agent]
timeout_sec = 120.0
user = "agent"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 2048
mcp_servers = []
workdir = "/workspace"

[environment.healthcheck]
command = "evidence ping"
interval_sec = 1.0
timeout_sec = 2.0
start_period_sec = 2.0
start_interval_sec = 0.5
retries = 10
