schema_version = "1.3"
artifacts = ["/var/lib/evidence/state.json"]

[task]
name = "instinct-bench/deployment-outage"
description = "A look-required Harbor learning task with priced evidence and deterministic grading."
authors = [{ name = "Adam Sioud" }]
keywords = ["context-appetite", "answer-or-look", "reasoning", "tool-use", "deterministic-verifier"]

[metadata]
implementation_version = "0.1.1"
difficulty = "easy"
category = "reasoning"
tags = ["instinct-bench", "context-efficiency", "evidence-selection"]
difficulty_explanation = "The task is intentionally small: the challenge is selecting useful evidence without opening every available record. It is a Harbor learning instance, not a standalone measure of context appetite."
solution_explanation = "The reference path opens the operational record containing the causal rollback entry, then submits the deployment ID supported by that record."
verification_explanation = "A separate verifier receives only the root-owned evidence state artifact. It requires an exact answer and the minimum sufficient evidence source for task success, then applies a small efficiency adjustment based on evidence credits consumed."

[verifier]
timeout_sec = 30.0
user = "root"
environment_mode = "separate"
collect = []

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 512
storage_mb = 1024
workdir = "/"

[agent]
timeout_sec = 120.0
user = "agent"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 2048
mcp_servers = []
workdir = "/workspace"

[environment.healthcheck]
command = "evidence ping"
interval_sec = 1.0
timeout_sec = 2.0
start_period_sec = 2.0
start_interval_sec = 0.5
retries = 5
