schema_version = "1.3"
artifacts = []

[task]
name = "instinct-bench/deployment-outage"
description = "Identify the deployment that caused an outage while opening no more evidence than necessary."
authors = [{ name = "Adam Sioud" }]
keywords = ["context-appetite", "answer-or-look", "reasoning", "tool-use", "deterministic-verifier"]

[metadata]
difficulty = "easy"
category = "reasoning"
tags = ["instinct-bench", "context-efficiency", "evidence-selection"]

[verifier]
timeout_sec = 30.0
user = "root"
collect = []

[agent]
timeout_sec = 120.0
user = "agent"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 2048
mcp_servers = []
workdir = "/workspace"

[environment.healthcheck]
command = "evidence ping"
interval_sec = 1.0
timeout_sec = 2.0
start_period_sec = 2.0
start_interval_sec = 0.5
retries = 5
